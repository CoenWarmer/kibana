"""A monday.com board."""
type Board {
  """The user's permission level for this board (view / edit)."""
  access_level: BoardAccessLevel!

  """
  The board log events. Starting from version 2027-01, this API will change: it
  will include more entities and will be capped to events from the last 90 days.
  """
  activity_logs(
    """Column ids to filter"""
    column_ids: [String]

    """From timestamp (ISO8601)"""
    from: ISO8601DateTime

    """Group ids to filter"""
    group_ids: [String]

    """Item id to filter"""
    item_ids: [ID!]

    """Number of items to get, the default is 25."""
    limit: Int = 25

    """Page number to get, starting at 1."""
    page: Int = 1

    """To timestamp (ISO8601)"""
    to: ISO8601DateTime

    """User ids to filter."""
    user_ids: [ID!]
  ): [ActivityLogType]

  """The board's folder unique identifier."""
  board_folder_id: ID

  """The board's kind (public / private / share)."""
  board_kind: BoardKind!

  """The board's visible columns."""
  columns(
    """
    A list of column capabilities to filter by. Returns columns that have any of the specified capabilities. Use null in the array to represent columns with no capabilities (e.g., [null] for only columns without capabilities, [null, CALCULATED] for columns without capabilities or with calculated).
    """
    capabilities: [ColumnCapability]

    """A list of column unique identifiers."""
    ids: [String]

    """A list of column types."""
    types: [ColumnType!]
  ): [Column]

  """The board's columns namespace."""
  columns_namespace: String

  """Get the board communication value - typically meeting ID"""
  communication: JSON

  """The time the board was created at."""
  created_at: ISO8601DateTime

  """
  The board's source board unique identifier (the board from which this board was created)
  """
  created_from_board_id: ID

  """The creator of the board."""
  creator: User!

  """The board's description."""
  description: String

  """
  The folder that contains this board, or null if it isn't in any folder.
  """
  folder: Folder

  """The board's visible groups."""
  groups(
    """A list of group unique identifiers."""
    ids: [String]
  ): [Group]

  """The hierarchy type of the board"""
  hierarchy_type: BoardHierarchy

  """The unique identifier of the board."""
  id: ID!

  """Inferred metadata associated with this board"""
  inferred_metadata: BoardInferredMetadata

  """
  The Board's item nickname, one of a predefined set of values, or a custom user value
  """
  item_terminology: String

  """The number of items on the board"""
  items_count: Int

  """The maximum number of items this board can have"""
  items_limit: Int

  """The board's items (rows)."""
  items_page(
    """
    An opaque token representing the position in the result set from which to
    resume fetching items. Use this to paginate through large result sets.
    """
    cursor: String

    """The hierarchy config to use for the query filters."""
    hierarchy_scope_config: String

    """
    The maximum number of items to fetch in a single request. Use this to
    control the size of the result set and manage pagination. Maximum: 500.
    """
    limit: Int! = 25

    """
    A set of parameters to filter, sort, and control the scope of the items
    query. Use this to customize the results based on specific criteria.
    """
    query_params: ItemsQuery
  ): ItemsResponse!

  """Manually set metadata associated with this board"""
  manual_metadata: BoardManualMetadata

  """The board's name."""
  name: String!

  """The Board's object type unique key"""
  object_type_unique_key: String

  """The owner of the board."""
  owner: User! @deprecated(reason: "This field returned creator of the board. Please use 'creator' or 'owners' fields instead.")

  """List of user board owners"""
  owners: [User]!

  """The board's permissions."""
  permissions: String!

  """The board's state (all / active / archived / deleted)."""
  state: State!

  """The board's subscribers."""
  subscribers: [User]!

  """The board's specific tags."""
  tags: [Tag]

  """List of team board owners"""
  team_owners(
    """Number of items to get, the default is 25."""
    limit: Int = 25

    """Page number to get, starting at 1."""
    page: Int = 1
  ): [Team!]

  """The board's team subscribers."""
  team_subscribers(
    """Number of items to get, the default is 25."""
    limit: Int = 25

    """Page number to get, starting at 1."""
    page: Int = 1
  ): [Team!]

  """The top group at this board."""
  top_group: Group!

  """The board object type."""
  type: BoardObjectType

  """The last time the board was updated at."""
  updated_at: ISO8601DateTime

  """The board's updates."""
  updates(
    """Should include only board-level updates."""
    board_updates_only: Boolean
    from_date: ISO8601DateTime

    """A list of items unique identifiers."""
    ids: [ID!]

    """Number of items to get, the default is 25."""
    limit: Int = 25

    """Page number to get, starting at 1."""
    page: Int = 1
    to_date: ISO8601DateTime
  ): [Update!]

  """The board's updates with cursor-based pagination."""
  updates_page(
    """Opaque cursor from a previous updates_page response."""
    cursor: String

    """Number of items to get, the default is 25."""
    limit: Int = 25
  ): UpdatesPage

  """The Board's url"""
  url: String!

  """The board's views."""
  views(
    """A list of view unique identifiers."""
    ids: [ID!]

    """The view's type"""
    type: String
  ): [BoardView]

  """The workspace that contains this board (null for main workspace)."""
  workspace: Workspace

  """The board's workspace unique identifier (null for main workspace)."""
  workspace_id: ID
}

